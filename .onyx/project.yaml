# Onyx project contract - Swartdraak/Proxmox-MCP
#
# Authoritative, executable contract. Every command below was verified to pass
# in an isolated Docker audit workspace on base SHA
# 13b32d2c24600b6d7623bea853713f373a01614b (branch main). See
# ../baseline.json for pass/fail evidence and ../baseline-logs/ for raw output.
#
# Do NOT store credentials or secrets here. Proxmox credentials are supplied at
# runtime via environment variables (see environment below).

project:
  name: "@swartdraak/proxmox-mcp-server"
  version: "1.0.0"
  description: >
    MCP (Model Context Protocol) server for Proxmox VE management via AI
    assistants. Exposes read-only and management tools (nodes, VMs, LXC
    containers, storage) over a stdio transport.

repository:
  provider: github
  owner_repo: Swartdraak/Proxmox-MCP
  immutable_repo_id: 1152653165
  canonical_url: https://github.com/Swartdraak/Proxmox-MCP
  default_branch: main

language: typescript
module_system: esm
package_manager: npm

runtime:
  # package.json declares node >=18.0.0. CI pins node-version '18'. The audit
  # workspace ran node v20.20.2 (delta noted; install/lint/build/smoke all pass).
  node: ">=18.0.0"
  ci_node: "18"
  audit_node: "20.20.2"

toolchain:
  # No external toolchain needed beyond Node.js + npm. TypeScript and the MCP
  # SDK are resolved from the npm registry via package-lock.json.

bootstrap:
  description: >
    Install locked dependencies. Note that the prepare script auto-runs
    npm run build on install.
  commands:
    - npm ci

build:
  description: >
    Compile TypeScript (src to dist). Strict compiler options.
  commands:
    - npm run build
  artifacts:
    - dist/index.js
    - dist/index.d.ts

lint:
  description: >
    TypeScript type check (tsc --noEmit). This is the repo lint gate.
  commands:
    - npm run lint

test:
  description: >
    Regression guard for issue #29 (lockfile security pins). The package.json
    test script is a placeholder that echoes "No tests"; the real regression net
    lives in tests/ and is run directly with node's built-in test runner.
  commands:
    - npm test
  regression_suite:
    description: >
      Node built-in test runner over tests/*.test.mjs. Verifies the checked-in
      package-lock.json still pins every security-audited package (fast-uri,
      hono, @hono/node-server, ip-address, path-to-regexp, form-data,
      express-rate-limit, axios, follow-redirects, qs, body-parser, ajv) at or
      above its advisory fixed-in version, that package.json remains
      lockfile-only unchanged, and that npm audit --audit-level=high exits 0.
    commands:
      - node --test tests/
    verified: 4/4 pass on the issue #29 remediation branch head

unit:
  description: >
    Not configured. No test framework or test files exist in-repo.
  commands: []

integration:
  description: >
    No automated integration suite. The MCP server talks to a live Proxmox VE
    over HTTPS; exercising the tools requires a real or synthetic Proxmox
    instance with credentials, which is out of scope for an isolated
    onboarding audit. Recorded as skipped (not failed) - see
    skipped_integrations.
  commands: []

security:
  description: >
    npm audit at the high threshold. After the issue #29 lockfile-only
    remediation (npm audit fix --package-lock-only), the dependency tree
    reports 0 vulnerabilities and this gate PASSES (exit 0). CI still runs it
    with continue-on-error true (tracked as issue #30 — remove that masking
    once the lockfile baseline is clean on main).
  commands:
    - npm audit --audit-level=high

# Runtime / health
runtime_smoke:
  description: >
    Boot the built server on stdio and confirm it answers an MCP initialize
    request. Proxmox credentials are NOT required to boot: config validation
    (PROXMOX_HOST / PROXMOX_USERNAME / auth) is deferred until the first tool
    call, so the smoke test runs clean with no live Proxmox backend.
  verified_command: node dist/index.js
  smoke_note: Send an MCP initialize request over stdio.
  expected: "jsonrpc response with serverInfo.name == 'proxmox-mcp-server'"
  # Audit evidence: server printed "Proxmox MCP Server running on stdio" and
  # returned protocolVersion 2024-11-05, serverInfo version 1.0.0.

environment:
  # All Proxmox access is via env vars (see .env.example). None are required to
  # boot or type-check; they are required to invoke any tool against a host.
  vars:
    - name: PROXMOX_HOST
      required_for: tools
      notes: Proxmox node hostname
    - name: PROXMOX_PORT
      required_for: tools
      default: "8006"
    - name: PROXMOX_USERNAME
      required_for: tools
    - name: PROXMOX_PASSWORD
      required_for: tools
      notes: Method 1 (password auth); do NOT commit
    - name: PROXMOX_TOKEN_ID
      required_for: tools
      notes: Method 2 (API token, recommended)
    - name: PROXMOX_TOKEN_SECRET
      required_for: tools
      notes: Method 2 (API token, recommended); do NOT commit
    - name: PROXMOX_REALM
      required_for: tools
      default: pam
    - name: PROXMOX_VERIFY_SSL
      required_for: tools
      default: "true"
    - name: PROXMOX_TIMEOUT
      required_for: tools
      default: "30000"

ci:
  provider: github-actions
  workflows:
    - name: CI Pipeline
      path: .github/workflows/ci.yml
      jobs: [lint, security, build]
      notes: >
        build job is a 3-OS matrix (ubuntu / windows / macos) on node 18;
        security job runs npm audit with continue-on-error true.
    - name: Release
      path: .github/workflows/release.yml
      notes: Tag-triggered npm publish; not part of the onboarding baseline.

autonomy:
  gates:
    - lint
    - build
    - security
    - runtime_smoke
  # unit + integration are unconfigured (not gating); security now gates after
  # the issue #29 lockfile refresh (npm audit --audit-level=high exits 0).

deployment:
  # Prohibited for production / enterprise. Isolated testing / semi-prod only,
  # with synthetic Proxmox data and scoped credentials.
  authorized: [isolated-testing, semi-production-validation]
  prohibited: [production, enterprise]
  method: >
    The MCP server is launched as a child stdio process by an MCP client
    (Claude, Cursor, Cline, Zed, VS Code, etc.) per the examples/ configs.
    There is no standalone daemon or service to deploy.
  rollback: Remove the MCP client config entry or uninstall the npm package.

skipped_integrations:
  - integration: live Proxmox VE
    reason: >
      Requires a real or synthetic Proxmox host plus credentials. Out of scope
      for an isolated onboarding audit with no Proxmox instance available in
      the workspace. Tool invocations are therefore not exercised; only
      boot / initialize is verified.
  - integration: unit tests
    reason: >
      No general-purpose test framework is configured (package.json test
      script is a no-op placeholder). A lockfile-security regression suite
      exists under tests/ (node --test tests/, 4 tests) guarding issue #29,
      but there is still no coverage for the MCP tool implementations.
  - integration: Docker / compose
    reason: No Dockerfile or docker-compose in the repository; nothing to build.

pre_existing_faults:
  - id: P1
    severity: high
    area: dependencies
    detail: >
      RESOLVED by issue #29: the lockfile-only remediation
      (npm audit fix --package-lock-only) raised every audited transitive
      (fast-uri, hono, @hono/node-server, ip-address, path-to-regexp,
      form-data, express-rate-limit, axios, follow-redirects, qs, body-parser,
      ajv) to its advisory fixed-in version. npm audit --audit-level=high now
      exits 0 with 0 vulnerabilities; npm ci / build / lint / stdio smoke are
      all green. The CI 'security' job still masks with continue-on-error
      true — tracked as issue #30 (sequenced after this PR lands).
    status: resolved
  - id: P2
    severity: low
    area: test-coverage
    detail: >
      npm test is a placeholder that prints "No tests". There is no unit or
      integration test coverage for the MCP tool implementations.
    status: open
